name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Formato
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias
        run: npm test
      - name: Build
        run: npm run build

      - name: Navegador para E2E
        # Sin --with-deps: evita el apt-get de paquetes de fuentes opcionales
        # (falló varias veces por DNS en los mirrors de Ubuntu); la imagen
        # ubuntu-latest de GitHub ya trae las librerías que Chromium necesita
        # para correr, solo le faltan esas fuentes que esta suite no usa.
        run: npx playwright install chromium
      - name: Pruebas E2E
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reporte-playwright
          path: test-results/
          retention-days: 7

  imagen:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
